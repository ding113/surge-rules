[package]
name = "surge-rules"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Multi-source GeoIP, Geofeed, BGP/ASN, and network-trait fusion engine producing MaxMind MMDB databases for Surge"
license = "MIT"
repository = "https://github.com/ding113/surge-rules"
publish = false

[[bin]]
name = "surge-rules"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
encoding_rs = "0.8"
flate2 = "1.0"
hex = "0.4"
indexmap = { version = "2.7", features = ["serde"] }
ipnet = { version = "2.10", features = ["serde"] }
lzma-rs = "0.3"
maxminddb = "0.24"
parquet = { version = "54.2", default-features = false, features = ["snap", "zstd", "flate2", "lz4"] }
rayon = "1.10"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream", "http2"] }
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.6"
tempfile = "3.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
