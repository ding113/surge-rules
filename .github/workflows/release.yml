name: Build & Release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "metadata/**"
      - "sources/**"
      - "overrides/**"
      - "scripts/**"
      - "cloudflare/**"
      - "package.json"
      - "bun.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Verify & Release Rules & MMDB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify TypeScript sources, overrides, README & runtime scripts
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Compute release timestamp
        id: meta
        run: |
          UTC_TAG="$(date -u +'%Y%m%d-%H%M')"
          UTC_ISO="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          UTC_HOUR="$(date -u +'%Y%m%d-%H')"
          UTC_DAY="$(date -u +'%Y%m%d')"
          UTC_TITLE="$(date -u +'%Y-%m-%d %H:%M UTC')"
          CN_TIME="$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          {
            echo "tag=release-${UTC_TAG}"
            echo "utc_iso=${UTC_ISO}"
            echo "hour=${UTC_HOUR}"
            echo "day=${UTC_DAY}"
            echo "title=Surge Rules ${UTC_TITLE}"
            echo "updated_at=${CN_TIME}"
          } >> "${GITHUB_OUTPUT}"

      - name: Cache upstream metadata feeds
        uses: actions/cache@v6
        with:
          path: .cache/metadata
          key: geoip-metadata-${{ runner.os }}-${{ hashFiles('metadata/sources.ts', 'metadata/sync.ts') }}-${{ steps.meta.outputs.hour }}
          restore-keys: |
            geoip-metadata-${{ runner.os }}-${{ hashFiles('metadata/sources.ts', 'metadata/sync.ts') }}-${{ steps.meta.outputs.day }}-
            geoip-metadata-${{ runner.os }}-${{ hashFiles('metadata/sources.ts', 'metadata/sync.ts') }}-
            geoip-metadata-${{ runner.os }}-

      - name: Cache upstream GeoIP ETag & payloads
        uses: actions/cache@v6
        with:
          path: .cache/upstream
          key: geoip-upstream-${{ runner.os }}-${{ hashFiles('sources/generated/geoip-sources.json') }}-${{ steps.meta.outputs.hour }}
          restore-keys: |
            geoip-upstream-${{ runner.os }}-${{ hashFiles('sources/generated/geoip-sources.json') }}-${{ steps.meta.outputs.day }}-
            geoip-upstream-${{ runner.os }}-${{ hashFiles('sources/generated/geoip-sources.json') }}-
            geoip-upstream-${{ runner.os }}-

      - name: Cache upstream Adblock ETag & payloads
        uses: actions/cache@v6
        with:
          path: .cache/adblock
          key: adblock-upstream-${{ runner.os }}-${{ hashFiles('sources/generated/adblock-sources.json') }}-${{ steps.meta.outputs.hour }}
          restore-keys: |
            adblock-upstream-${{ runner.os }}-${{ hashFiles('sources/generated/adblock-sources.json') }}-${{ steps.meta.outputs.day }}-
            adblock-upstream-${{ runner.os }}-${{ hashFiles('sources/generated/adblock-sources.json') }}-
            adblock-upstream-${{ runner.os }}-

      - name: Cache upstream Routing ETag & payloads
        uses: actions/cache@v6
        with:
          path: .cache/routing
          key: routing-upstream-${{ runner.os }}-${{ hashFiles('sources/generated/routing-sources.json') }}-${{ steps.meta.outputs.hour }}
          restore-keys: |
            routing-upstream-${{ runner.os }}-${{ hashFiles('sources/generated/routing-sources.json') }}-${{ steps.meta.outputs.day }}-
            routing-upstream-${{ runner.os }}-${{ hashFiles('sources/generated/routing-sources.json') }}-
            routing-upstream-${{ runner.os }}-

      - name: Sync upstream GeoIP metadata bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run sync:metadata -- --max-cache-age-secs 300 --fallback-existing
          bun run verify:metadata

      - name: Run release test suite
        run: cargo test --release --all-targets

      - name: Build multi-source GeoIP MMDB databases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_LOG: info
        run: cargo run --release -- geoip build --max-cache-age-secs 300 --output dist

      - name: Verify generated MMDB artifacts
        run: cargo run --release -- geoip verify --dir dist

      - name: Build Adblock RULE-SET & Surge Module
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_LOG: info
        run: cargo run --release -- adblock build --max-cache-age-secs 300 --output dist

      - name: Verify generated Adblock artifacts
        run: cargo run --release -- adblock verify --dir dist

      - name: Build Routing RULE-SETs (Direct.list, AI.list, Proxy.list)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_LOG: info
        run: cargo run --release -- routing build --max-cache-age-secs 300 --output dist

      - name: Verify generated Routing artifacts
        run: cargo run --release -- routing verify --dir dist

      - name: Combine release notes and validate all 9 artifacts
        run: |
          for f in Country.mmdb Country-only.mmdb Country-cn.mmdb ASN.mmdb Adblock.list Adblock.sgmodule Direct.list AI.list Proxy.list; do
            test -s "dist/${f}"
          done
          {
            cat dist/release-notes.md
            printf '\n---\n\n'
            cat dist/adblock-notes.md
            printf '\n---\n\n'
            cat dist/routing-notes.md
          } > dist/combined-notes.md

      - name: Mirror all build artifacts, badge & metadata to Cloudflare R2 (latest only)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://199c831f9865b14c47f24f2f8b0c8ce6.r2.cloudflarestorage.com
          R2_BUCKET: surge-rules
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          UTC_ISO: ${{ steps.meta.outputs.utc_iso }}
          UPDATED_AT: ${{ steps.meta.outputs.updated_at }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::error::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY repository secrets are not configured"
            exit 1
          fi
          # updated-at.svg, build-meta.json (public, R2) and README.md (release branch only).
          mkdir -p dist/release-meta
          STAGE_DIR=dist/release-meta bun run scripts/build-release-meta.ts
          r2_put() {
            echo "Uploading ${2} ($(wc -c < "${1}" | tr -d ' ') bytes) to r2://${R2_BUCKET}/${2}"
            aws s3 cp "${1}" "s3://${R2_BUCKET}/${2}" \
              --endpoint-url "${R2_ENDPOINT}" \
              --content-type "${3}" \
              --cache-control "${4}" \
              --only-show-errors
          }
          ARTIFACTS=(Country.mmdb Country-only.mmdb Country-cn.mmdb ASN.mmdb Adblock.list Adblock.sgmodule Direct.list AI.list Proxy.list)
          for f in "${ARTIFACTS[@]}"; do
            case "${f}" in
              *.mmdb) r2_put "dist/${f}" "${f}" "application/octet-stream" "public, max-age=3600, stale-while-revalidate=86400" ;;
              *) r2_put "dist/${f}" "${f}" "text/plain; charset=utf-8" "public, max-age=1800, stale-while-revalidate=86400" ;;
            esac
          done
          # Metadata last, so it never advertises a build whose artifacts are not uploaded yet.
          NO_CACHE="no-cache, no-store, max-age=0, s-maxage=0, must-revalidate"
          r2_put dist/release-meta/build-meta.json build-meta.json "application/json; charset=utf-8" "${NO_CACHE}"
          r2_put dist/release-meta/updated-at.svg updated-at.svg "image/svg+xml; charset=utf-8" "${NO_CACHE}"
          # Keep only the latest build: drop any object that is not part of this release.
          EXPECTED=" ${ARTIFACTS[*]} build-meta.json updated-at.svg "
          aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --endpoint-url "${R2_ENDPOINT}" \
            --query 'Contents[].Key' --output text | tr '\t' '\n' | while IFS= read -r key; do
            if [ -n "${key}" ] && [ "${key}" != "None" ] && [[ "${EXPECTED}" != *" ${key} "* ]]; then
              echo "Deleting stale R2 object: ${key}"
              aws s3 rm "s3://${R2_BUCKET}/${key}" --endpoint-url "${R2_ENDPOINT}" --only-show-errors
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: dist/combined-notes.md
          make_latest: "true"
          files: |
            dist/Country.mmdb
            dist/Country-only.mmdb
            dist/Country-cn.mmdb
            dist/ASN.mmdb
            dist/Adblock.list
            dist/Adblock.sgmodule
            dist/Direct.list
            dist/AI.list
            dist/Proxy.list

      - name: Prune older GitHub Releases and tags (retain latest 1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          OLD_RELEASES=()
          while IFS= read -r tag; do
            if [ -n "${tag}" ] && [ "${tag}" != "${RELEASE_TAG}" ]; then
              OLD_RELEASES+=("${tag}")
            fi
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')
          if [ "${#OLD_RELEASES[@]}" -gt 0 ]; then
            for tag in "${OLD_RELEASES[@]}"; do
              echo "Deleting older GitHub Release and tag: ${tag}"
              gh release delete "${tag}" --yes --cleanup-tag || true
            done
          fi
          OLD_TAGS=()
          while IFS= read -r tag; do
            if [ -n "${tag}" ] && [ "${tag}" != "${RELEASE_TAG}" ]; then
              OLD_TAGS+=("${tag}")
            fi
          done < <(git ls-remote --tags --refs origin 'refs/tags/release-*' | awk '{sub("refs/tags/", "", $2); print $2}')
          if [ "${#OLD_TAGS[@]}" -gt 0 ]; then
            for tag in "${OLD_TAGS[@]}"; do
              echo "Deleting leftover remote release tag: ${tag}"
              git push origin ":refs/tags/${tag}" || true
            done
          fi

      - name: Sync Cloudflare Worker, static pages & release README to rolling release branch (retain latest 24)
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          STAGE_DIR="$(mktemp -d)"
          TMP_INDEX="$(mktemp)"
          rm -f "${TMP_INDEX}"
          touch "${STAGE_DIR}/.nojekyll"
          cp cloudflare/wrangler.jsonc "${STAGE_DIR}/wrangler.jsonc"
          cp cloudflare/worker.js "${STAGE_DIR}/worker.js"
          cp cloudflare/.assetsignore "${STAGE_DIR}/.assetsignore"
          cp cloudflare/_headers "${STAGE_DIR}/_headers"
          cp cloudflare/_redirects "${STAGE_DIR}/_redirects"
          for script_file in scripts/*.html scripts/*.js; do
            if [ -f "${script_file}" ]; then
              cp "${script_file}" "${STAGE_DIR}/$(basename "${script_file}")"
            fi
          done
          # Build artifacts, updated-at.svg and build-meta.json are served from R2, not from this branch.
          cp dist/release-meta/README.md "${STAGE_DIR}/README.md"
          GIT_INDEX_FILE="${TMP_INDEX}" git --work-tree="${STAGE_DIR}" add --all
          TREE_SHA="$(GIT_INDEX_FILE="${TMP_INDEX}" git write-tree)"
          git fetch --no-tags --filter=blob:none --depth=25 origin refs/heads/release:refs/remotes/origin/release || true
          PARENT_SHA=""
          if git rev-parse --verify --quiet refs/remotes/origin/release >/dev/null; then
            TOTAL_FETCHED="$(git rev-list --count refs/remotes/origin/release)"
            if [ "${TOTAL_FETCHED}" -lt 24 ]; then
              PARENT_SHA="$(git rev-parse refs/remotes/origin/release)"
            else
              OLD_COMMITS=()
              while IFS= read -r c; do
                if [ -n "${c}" ]; then
                  OLD_COMMITS+=("${c}")
                fi
              done < <(git rev-list --max-count=23 --reverse refs/remotes/origin/release)
              for c in "${OLD_COMMITS[@]}"; do
                c_tree="$(git rev-parse "${c}^{tree}")"
                c_msg="$(git log -1 --format=%B "${c}")"
                c_an="$(git log -1 --format=%an "${c}")"
                c_ae="$(git log -1 --format=%ae "${c}")"
                c_ad="$(git log -1 --format=%aI "${c}")"
                c_cn="$(git log -1 --format=%cn "${c}")"
                c_ce="$(git log -1 --format=%ce "${c}")"
                c_cd="$(git log -1 --format=%cI "${c}")"
                if [ -z "${PARENT_SHA}" ]; then
                  PARENT_SHA="$(
                    GIT_AUTHOR_NAME="${c_an}" GIT_AUTHOR_EMAIL="${c_ae}" GIT_AUTHOR_DATE="${c_ad}" \
                    GIT_COMMITTER_NAME="${c_cn}" GIT_COMMITTER_EMAIL="${c_ce}" GIT_COMMITTER_DATE="${c_cd}" \
                    git commit-tree "${c_tree}" -m "${c_msg}"
                  )"
                else
                  PARENT_SHA="$(
                    GIT_AUTHOR_NAME="${c_an}" GIT_AUTHOR_EMAIL="${c_ae}" GIT_AUTHOR_DATE="${c_ad}" \
                    GIT_COMMITTER_NAME="${c_cn}" GIT_COMMITTER_EMAIL="${c_ce}" GIT_COMMITTER_DATE="${c_cd}" \
                    git commit-tree "${c_tree}" -p "${PARENT_SHA}" -m "${c_msg}"
                  )"
                fi
              done
            fi
          fi
          if [ -z "${PARENT_SHA}" ]; then
            COMMIT_SHA="$(
              GIT_AUTHOR_NAME="github-actions[bot]" \
              GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
              GIT_COMMITTER_NAME="github-actions[bot]" \
              GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
              git commit-tree "${TREE_SHA}" -m "chore(release): ${RELEASE_TAG}"
            )"
          else
            COMMIT_SHA="$(
              GIT_AUTHOR_NAME="github-actions[bot]" \
              GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
              GIT_COMMITTER_NAME="github-actions[bot]" \
              GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
              git commit-tree "${TREE_SHA}" -p "${PARENT_SHA}" -m "chore(release): ${RELEASE_TAG}"
            )"
          fi
          git push --force origin "${COMMIT_SHA}:refs/heads/release"
          rm -rf "${STAGE_DIR}" "${TMP_INDEX}"
