name: Build GeoIP

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "metadata/**"
      - "sources/**"
      - "overrides/**"
      - "package.json"
      - "bun.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-geoip.yml"

permissions:
  contents: write

concurrency:
  group: build-geoip
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Verify & Release MMDB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify TypeScript sources and overrides
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Compute cache timestamp
        id: meta
        run: |
          UTC_TAG="$(date -u +'%Y%m%d-%H%M')"
          UTC_DAY="$(date -u +'%Y%m%d')"
          UTC_TITLE="$(date -u +'%Y-%m-%d %H:%M UTC')"
          {
            echo "tag=geoip-${UTC_TAG}"
            echo "day=${UTC_DAY}"
            echo "title=GeoIP ${UTC_TITLE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Cache upstream metadata feeds
        uses: actions/cache@v6
        with:
          path: .cache/metadata
          key: geoip-metadata-${{ runner.os }}-${{ hashFiles('metadata/sources.ts', 'metadata/sync.ts') }}-${{ steps.meta.outputs.day }}
          restore-keys: |
            geoip-metadata-${{ runner.os }}-${{ hashFiles('metadata/sources.ts', 'metadata/sync.ts') }}-
            geoip-metadata-${{ runner.os }}-

      - name: Cache upstream ETag & feed payloads
        uses: actions/cache@v6
        with:
          path: .cache/upstream
          key: geoip-upstream-${{ runner.os }}-${{ hashFiles('sources/generated/geoip-sources.json') }}-${{ steps.meta.outputs.day }}
          restore-keys: |
            geoip-upstream-${{ runner.os }}-${{ hashFiles('sources/generated/geoip-sources.json') }}-
            geoip-upstream-${{ runner.os }}-

      - name: Sync upstream GeoIP metadata bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run sync:metadata -- --fallback-existing
          bun run verify:metadata

      - name: Run release test suite
        run: cargo test --release --all-targets

      - name: Build multi-source GeoIP MMDB databases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_LOG: info
        run: cargo run --release -- geoip build --output dist

      - name: Verify generated MMDB artifacts
        run: cargo run --release -- geoip verify --dir dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: dist/release-notes.md
          make_latest: "true"
          files: |
            dist/Country.mmdb
            dist/Country-cn.mmdb
            dist/ASN.mmdb
